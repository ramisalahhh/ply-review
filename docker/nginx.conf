# Static site only: the review runs in the browser (nginx's default mime.types
# already serves .wasm as application/wasm).
server {
    listen 80;
    root /usr/share/nginx/html;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # single-page app: unknown paths go to index.html
    location / {
        try_files $uri /index.html;
    }
}
